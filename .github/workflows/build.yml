name: Build

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-cleanup: on-success

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-artifact
          path: build/distributions/*.zip

      - name: Clean build outputs
        if: always()
        run: ./gradlew clean

  verify:
    name: Verify Plugin Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-cleanup: on-success

      - name: Verify plugin
        timeout-minutes: 45
        run: ./gradlew verifyPlugin

      - name: Clean build outputs
        if: always()
        run: ./gradlew clean
